<!doctype html>
<html lang="tr" data-theme="light" data-view="plain">
<head>
  <meta charset="utf-8">
  <title>Ahmet Deniz Dündar | Frontend Geliştirici ve SEO Uzmanı</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="İstanbul’da frontend geliştirici ve SEO uzmanı.">
  <meta name="author" content="Ahmet Deniz Dündar">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ECE9E2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="index, follow, max-image-preview:large">

  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Ahmet Deniz Dündar">
  <meta property="og:image" content="https://ahmetdenizdundar.com.tr/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@add1283">
  <meta name="twitter:image" content="https://ahmetdenizdundar.com.tr/img/og.png">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Theme and view are applied before first paint to avoid a flash. -->
  <script>
    (function () {
      var h = document.documentElement, s = {};
      try { s.theme = localStorage.getItem('add-theme'); s.view = localStorage.getItem('add-view'); } catch (e) {}
      var mq = function (q) { return window.matchMedia && matchMedia(q).matches; };
      h.dataset.theme = s.theme || (mq('(prefers-color-scheme: dark)') ? 'dark' : 'light');
      h.dataset.view = s.view || (mq('(prefers-reduced-motion: reduce)') ? 'plain' : '3d');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
