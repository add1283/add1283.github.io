<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı | Ahmet Deniz Dündar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #ece9e2; --ink: #111317; --muted: #555c66; --accent: #2754d6; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111317; --ink: #ece9e2; --muted: #8b939e; --accent: #4a7dff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 17px/1.6 'IBM Plex Sans', system-ui, sans-serif; }
    .code { font: 13px/1 ui-monospace, Menlo, monospace; color: var(--muted); margin-bottom: 1.5rem; }
    .code::after { content: ''; display: block; width: 64px; height: 2px; margin-top: 12px; background: var(--accent); }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1; margin: 0 0 1rem; letter-spacing: -0.03em; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 0.3em; margin-right: 1.5rem; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 / not found</p>
    <h1>Bu sayfa yok.</h1>
    <p>Adres değişmiş ya da yanlış yazılmış olabilir. This page doesn’t exist.</p>
    <a href="/">Ana sayfa</a><a href="/en">English</a>
  </main>
</body>
</html>
