<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı | Ahmet Deniz Dündar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f3f5f8; --ink: #141a2e; --muted: #4a5368; --accent: #2346a0; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c1324; --ink: #e8ecf4; --muted: #a9b2c6; --accent: #9db3f5; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, sans-serif; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1; margin: 0 0 1rem; letter-spacing: -0.03em; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 0.3em; margin-right: 1.5rem; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>Bu sayfa yok.</h1>
    <p>Adres değişmiş ya da yanlış yazılmış olabilir. This page doesn’t exist.</p>
    <a href="/">Ana sayfa</a><a href="/en">English</a>
  </main>
</body>
</html>
